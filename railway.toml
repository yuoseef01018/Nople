# Railway configuration for Nople
# This ensures Railway uses the Dockerfile as a single service, not multiple.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "cd /app/apps/api && bunx medusa start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
