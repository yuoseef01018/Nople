# Nixpacks configuration for Nople on Railway
# This file tells Railway's Nixpacks builder how to build and run the Nople coffee marketplace.

[phases.setup]
nixPkgs = ['bun', 'nodejs_20', 'postgresql_15']

[phases.install]
cmds = ['bun install --frozen-lockfile']

[phases.build]
cmds = [
  'bun run build 2>&1 || true',
  'cd /app/apps/admin-test && bun run build 2>&1 || true',
  'cd /app/apps/vendor && bun run build 2>&1 || true',
  'cd /app/apps/api && bunx medusa build 2>&1 || true'
]

[start]
cmd = 'cd /app/apps/api && bunx medusa start'
